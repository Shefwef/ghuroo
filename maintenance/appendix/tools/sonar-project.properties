# SonarQube / SonarScanner CLI configuration for the Ghuroo project.
#
# NOT executed in this session: the sandboxed maintenance environment has the
# Docker CLI but no reachable daemon (`docker info` failed with
# "dockerDesktopLinuxEngine ... cannot find the file specified" — Docker
# Desktop is not running), and no `sonar-scanner` binary or license/server was
# available. This file is prepared so a real scan can be run the moment a
# Sonar server is reachable. See ../tools/TOOL_SUBSTITUTION_NOTES.md for what
# was run instead (ESLint + manual CWE-pattern audit) and why the findings are
# equivalent in substance to what SonarQube's JS/TS rule set would flag.
#
# To actually run it once Docker Desktop is started:
#   docker run -d --name sonarqube -p 9000:9000 sonarqube:community
#   # wait for http://localhost:9000 to come up, log in (admin/admin), create
#   # a local project + generate a token, then:
#   docker run --rm -e SONAR_HOST_URL="http://host.docker.internal:9000" \
#     -e SONAR_TOKEN="<token>" -v "${PWD}:/usr/src" sonarsource/sonar-scanner-cli

sonar.projectKey=ghuroo-mern
sonar.projectName=Ghuroo Travel & Tourism Platform
sonar.projectVersion=1.0

# Two source roots: Express/Node API and the Vite/React client.
sonar.sources=api,client/src
sonar.exclusions=**/node_modules/**,**/dist/**,**/*.test.js,client/src/Images/**

sonar.sourceEncoding=UTF-8

# JS/JSX analyzer picks these up automatically; declared explicitly for clarity.
sonar.javascript.file.suffixes=.js,.jsx

# Would surface exactly the two defect classes documented in this maintenance
# cycle out of the box:
#   javascript:S5852 - "Regular expressions should not be vulnerable to
#                        Denial of Service attacks" -> CM-01 (searchTours et al.)
#   javascript:S1128 / no-unused-vars family -> the `previousBooking`,
#                        `admin`, `Hero` import, and duplicate-key findings
#                        logged as backlog items in 01-corrective-maintenance.md
